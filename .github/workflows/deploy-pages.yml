name: Deploy site to GitHub Pages

# Publishes the static site in docs/ (index.html + assets/ + content/*.md)
# to GitHub Pages. The landing page, left-hand tabs and section menus are
# rendered client-side, so nothing about the site layout changes - this only
# swaps the delivery mechanism from "Deploy from a branch" to GitHub Actions.
#
# REQUIRED once: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Least-privilege token scopes required by the Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
